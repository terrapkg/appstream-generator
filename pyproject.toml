[project]
name = "appstream-generator"
version = "0.1.0"
description = "Generate AppStream metadata for the Terra RPM repos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "logfmter>=0.0.10",
    "python-dotenv>=1.1.1",
]

# Not "appstream-generator": that would shadow the asgen binary on PATH
[project.scripts]
terra-appstream = "terra_appstream.cli:main"
terra-appstream-lint = "terra_appstream.lint:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "terra_appstream"
