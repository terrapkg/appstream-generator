# Browse the TERRA=1 dev output at http://localhost:8080
# (/output/ is what Subatomic reads, /report/html/ is asgen's report).
#
#   podman compose -f scripts/docker-compose.yml up
services:
  caddy:
    image: docker.io/library/caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ../output-terra:/srv/output:ro,z
      - ../workspace-terra/export:/srv/report:ro,z
